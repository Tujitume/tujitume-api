name: Backend Prod Deploy

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, curl, dom, fileinfo, openssl, pdo_sqlite
          coverage: none

      # Setup Composer cache
      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # Install dependencies (including dev for testing)
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Copy environment
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # Generate app key
      - name: Generate application key
        run: php artisan key:generate

      # SQLite for tests
      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      # Storage permissions
      - name: Set permissions
        run: chmod -R 777 storage bootstrap/cache

      # Run tests
      - name: Run PHPUnit tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      ####################################################
      # Build production package
      ####################################################

      - name: Clean development dependencies
        run: |
          rm -rf vendor
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      ####################################################
      # Prepare deployment bundle
      ####################################################

      - name: Prepare deployment package
        run: |
          mkdir package

          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/cache/*" \
            --exclude="storage/framework/sessions/*" \
            --exclude="storage/framework/views/*" \
            ./ package/

          cd package
          zip -r ../backend-prod-${{ github.sha }}.zip .

      ####################################################
      # AWS
      ####################################################

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ####################################################
      # Upload to S3
      ####################################################

      - name: Upload deployment bundle
        run: |
          aws s3 cp \
            backend-prod-${{ github.sha }}.zip \
            s3://${{ secrets.S3_BUCKET }}/backend-prod/backend-prod-${{ github.sha }}.zip

      ####################################################
      # Deploy
      ####################################################

      - name: Create CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_GROUP }} \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --ignore-application-stop-failures
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=backend-prod/backend-prod-${{ github.sha }}.zip,bundleType=zip
